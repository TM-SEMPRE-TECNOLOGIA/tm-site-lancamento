<style>
  :root {
    --primary: #0afcdb;
    --primary-glow: rgba(10, 252, 219, 0.45);
    --orange: #d96526;
    --orange-glow: rgba(217, 101, 38, 0.55);
    --bg-dark: #030608;
    --card-bg: rgba(6, 11, 16, 0.92);
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-dark);
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* Palco Cyberpunk de Alta Fidelidade */
  .cyber-stage {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 35%, rgba(10, 252, 219, 0.06) 0%, transparent 65%),
                linear-gradient(180deg, #030608 0%, #050a0f 50%, #030608 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
  }

  /* Texturas Originais Extraídas */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background: url('grid.svg') repeat;
    opacity: 0.04;
    pointer-events: none;
  }
  .scanline-overlay {
    position: absolute;
    inset: 0;
    background: url('scanlines.svg') repeat;
    opacity: 0.05;
    pointer-events: none;
  }
  .art-ground {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 1400px;
    height: 440px;
    background: url('art-bg.webp') bottom center/cover no-repeat;
    opacity: 0.8;
    pointer-events: none;
    mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, transparent 100%);
  }

  /* Efeito de Lanterna / Mouse Spotlight */
  #mouse-spotlight {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(10, 252, 219, 0.12) 0%, rgba(217, 101, 38, 0.05) 45%, transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
    z-index: 2;
  }

  /* Cabeçalho da Seção */
  .section-header {
    position: relative;
    z-index: 10;
    text-align: center;
    margin-bottom: 24px;
  }
  .eyebrow-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--orange);
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .section-subtitle {
    font-size: 13px;
    color: #64748b;
    font-family: 'JetBrains Mono', monospace;
    margin-top: 6px;
  }

  /* Palco Central do Avatar */
  .avatar-stage-wrapper {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1280px;
    height: 880px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* SVG Canvas das Linhas de Conexão Laser */
  #laser-svg-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 8;
  }

  .avatar-figure {
    position: relative;
    height: 100%;
    max-height: 880px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .avatar-img {
    height: 100%;
    max-height: 880px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 50px rgba(0,0,0,0.95)) drop-shadow(0 0 25px rgba(10, 252, 219, 0.2));
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Hotspots dos Chakras */
  .chakra-node {
    position: absolute;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 25;
  }
  .chakra-pulse {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1.5px solid currentColor;
    opacity: 0.6;
    animation: nodePulse 2.2s infinite cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .chakra-core {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 22px currentColor;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .chakra-node:hover .chakra-core,
  .chakra-node.active .chakra-core {
    transform: scale(1.7);
  }

  @keyframes nodePulse {
    0% { transform: scale(0.8); opacity: 0.9; }
    50% { transform: scale(1.8); opacity: 0.25; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* Linhas Laser SVG Estilizadas */
  .laser-beam {
    stroke-width: 1.5;
    fill: none;
    opacity: 0.45;
    transition: all 0.35s ease;
  }
  .laser-beam.active {
    stroke-width: 2.5;
    opacity: 1;
    filter: drop-shadow(0 0 8px currentColor);
  }

    position: absolute;
    width: 320px;
    background: var(--card-bg);

    border: 1px solid var(--border);

    border-radius: 8px;

    box-shadow: 0 16px 36px rgba(0,0,0,0.7);
    overflow: hidden;

    border-color: var(--card-accent, var(--orange));
    box-shadow: 0 24px 60px rgba(0,0,0,0.95), 0 0 32px var(--card-glow, var(--orange-glow));

    z-index: 40;

    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .skill-card-category {

    font-size: 9.5px;
    letter-spacing: 1.5px;
    color: var(--card-accent, var(--orange));
    text-transform: uppercase;
    font-weight: 700;
  }
  .skill-card-chakra {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #94a3b8;
  }
  .skill-card-title {

    font-size: 16px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .expand-indicator {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--card-accent, var(--orange));
    transition: transform 0.3s;
  }
  .skill-floating-card.active .expand-indicator {

  .skill-card-summary {

  }
  .skill-tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;

  .skill-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #cbd5e1;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 7px;
    border-radius: 4px;
  }

  /* CONTEÚDO EXPANSÍVEL DO PRÓPRIO CARD (SEM MODAL / SEM DRAWERS) */
  .skill-expanded-body {
    max-height: 0;
    opacity: 0;
    transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    overflow: hidden;
  }
  .skill-floating-card.active .skill-expanded-body {
    max-height: 380px;
    opacity: 1;
    margin-top: 14px;
    padding-top: 14px;

    border: 1px solid rgba(255,255,255,0.06);

    border-radius: 4px;

  .expanded-spec-item strong {

    font-size: 10px;
    display: block;
    margin-bottom: 2px;

    font-family: 'JetBrains Mono', monospace;

  /* Barra de Alerta no Topo */

    position: fixed;
    top: 14px;
    left: 50%;

    font-family: 'JetBrains Mono', monospace;

    color: #fed7aa;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.8);

</style>

function buildStage() {
  const wrapper = document.getElementById('stage-wrapper');
  const svg = document.getElementById('laser-svg-canvas');

  SKILLS_DATA.forEach((s) => {
    // 1. Criar Nó do Chakra
    const node = document.createElement('div');
    node.className = 'chakra-node';
    node.id = `node-${s.id}`;
    node.style.color = s.color;
    node.style.top = `${s.chakraY}%`;
    node.style.left = '50%';
    node.innerHTML = `
      <div class="chakra-pulse"></div>
      <div class="chakra-core"></div>
    `;
    node.onclick = () => toggleCard(s.id);
    wrapper.appendChild(node);

    // 2. Criar Linha Laser SVG
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.id = `laser-${s.id}`;
    path.setAttribute('class', 'laser-beam');
    path.setAttribute('stroke', s.color);
    svg.appendChild(path);

    // 3. Criar Card Lateral com Expansão Inline
    const card = document.createElement('div');
    card.className = 'skill-floating-card';
    card.id = `card-${s.id}`;
    card.style.setProperty('--card-accent', s.color);
    card.style.setProperty('--card-glow', `${s.color}66`);
    card.style.top = `${s.cardY}%`;
    card.style.left = `${s.cardX}%`;

    let tagsHtml = s.tags.map(t => `<span class="skill-pill">${t}</span>`).join('');
    let specsHtml = s.details.map(d => `
      <div class="expanded-spec-item">
        <strong>${d.label}</strong>
        ${d.value}
      </div>
    `).join('');

    card.innerHTML = `
      <div class="skill-card-top">
        <span class="skill-card-category">${s.category}</span>
        <span class="skill-card-chakra">${s.chakra}</span>
      </div>
      <div class="skill-card-title">
        <span>${s.name}</span>
        <span class="expand-indicator">+</span>
      </div>
      <div class="skill-card-summary">${s.summary}</div>
      <div class="skill-tags-row">${tagsHtml}</div>
      
      <!-- Corpo Expansível Direto no Card (Sem Modal) -->
      <div class="skill-expanded-body">
        <p class="expanded-desc">${s.description}</p>
        <div class="expanded-spec-list">${specsHtml}</div>
        <a href="https://github.com/${s.repo}" target="_blank" class="card-github-link">
          <span>Repositório: ${s.repo}</span>
          <span>↗</span>
        </a>
      </div>
    `;
    card.onclick = (e) => {
      if (e.target.closest('a')) return;
      toggleCard(s.id);
    };
    wrapper.appendChild(card);
  });

  updateLaserLines();
}

function updateLaserLines() {
  const wrapperRect = document.getElementById('stage-wrapper').getBoundingClientRect();

  SKILLS_DATA.forEach(s => {
    const nodeEl = document.getElementById(`node-${s.id}`);
    const cardEl = document.getElementById(`card-${s.id}`);
    const laserEl = document.getElementById(`laser-${s.id}`);

    if (!nodeEl || !cardEl || !laserEl) return;

    const nodeRect = nodeEl.getBoundingClientRect();
    const cardRect = cardEl.getBoundingClientRect();

    // Coordenadas relativas ao SVG wrapper
    const x1 = nodeRect.left + nodeRect.width / 2 - wrapperRect.left;
    const y1 = nodeRect.top + nodeRect.height / 2 - wrapperRect.top;

    // Conecta no lado mais próximo do card
    const x2 = s.side === 'right' ? (cardRect.left - wrapperRect.left) : (cardRect.right - wrapperRect.left);
    const y2 = cardRect.top + 32 - wrapperRect.top;

    // Curva cúbica elegante estilo placa de circuito/sci-fi
    const midX = (x1 + x2) / 2;
    const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
    laserEl.setAttribute('d', d);
  });
}

function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  const node = document.getElementById(`node-${id}`);
  const laser = document.getElementById(`laser-${id}`);
  const isAlreadyActive = card.classList.contains('active');

  // Fecha outros cards
  document.querySelectorAll('.skill-floating-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.chakra-node').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.laser-beam').forEach(l => l.classList.remove('active'));

  if (!isAlreadyActive) {
    card.classList.add('active');
    node.classList.add('active');
    laser.classList.add('active');
  }

  setTimeout(updateLaserLines, 100);
}

// Efeito de Lanterna do Mouse (Spotlight) e Parallax Suave
window.addEventListener('mousemove', (e) => {
  const spotlight = document.getElementById('mouse-spotlight');
  gsap.to(spotlight, {
    x: e.clientX,
    y: e.clientY + window.scrollY,
    duration: 0.25,
    ease: "power2.out"
  });

  // Parallax sutil no avatar
  const avatarImg = document.getElementById('avatar-img');
  const deltaX = (e.clientX - window.innerWidth / 2) * 0.012;
  const deltaY = (e.clientY - window.innerHeight / 2) * 0.012;
  gsap.to(avatarImg, {
    x: deltaX,
    y: deltaY,
    duration: 0.5,
    ease: "power2.out"
  });
});

window.addEventListener('resize', updateLaserLines);
window.addEventListener('DOMContentLoaded', buildStage);
</script>
