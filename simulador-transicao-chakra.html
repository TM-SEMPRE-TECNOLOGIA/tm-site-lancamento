// 1. ENGINE 3D THREE.JS DO CARROSSEL DE PROJETOS (JESPER CLONE)
// ══════════════════════════════════════════════════════════════════════
let scene, camera, renderer;
let cardMeshes = [];
const TOTAL_CARDS = 8;
const CARD_SPACING = 5.2;
const CYLINDER_RADIUS = 10.0;

function init3D() {
  const canvas = document.getElementById('webgl-carousel-canvas');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070b, 0.04);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0.2, 7.5);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Iluminação
  const ambient = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambient);
  const pointLight = new THREE.PointLight(0xd96526, 3.5, 30);
  pointLight.position.set(0, 3, 5);
  scene.add(pointLight);

  // Grade no chão
  const gridHelper = new THREE.GridHelper(60, 60, 0xd96526, 0x4a1e0b);
  gridHelper.material.opacity = 0.55;
  gridHelper.material.transparent = true;
  gridHelper.position.set(0, -1.8, -5);
  scene.add(gridHelper);

  // Criar os 8 cards do carrossel
  const cardGeo = new THREE.PlaneGeometry(3.6, 2.2, 16, 16);
  for (let i = 0; i < TOTAL_CARDS; i++) {
    const isFinal = (i === TOTAL_CARDS - 1);
    const mat = new THREE.MeshBasicMaterial({
      color: isFinal ? 0xd96526 : 0x141f2e,
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(cardGeo, mat);
    
    // Wireframe nas bordas
    const edges = new THREE.EdgesGeometry(cardGeo);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: isFinal ? 0x0afcdb : 0x334155 }));
    mesh.add(line);

    mesh.userData = { index: i };
    scene.add(mesh);
    cardMeshes.push(mesh);
  }

  window.addEventListener('resize', onResize);
  animate();
}

function updateCarouselCards(scrollVal) {
  const totalWidth = TOTAL_CARDS * CARD_SPACING;

  cardMeshes.forEach((mesh, i) => {
    let xOffset = (i * CARD_SPACING - scrollVal) % totalWidth;
    if (xOffset < -totalWidth / 2) xOffset += totalWidth;
    if (xOffset > totalWidth / 2) xOffset -= totalWidth;

    mesh.position.x = xOffset;
    mesh.position.y = 0;

    const arc = xOffset / CYLINDER_RADIUS;
    mesh.position.z = -((1.0 - Math.cos(arc)) * CYLINDER_RADIUS);
    mesh.rotation.y = -arc;
  });
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateLaserLines();
}

function buildChakraElements() {
  const content = document.getElementById('chakra-stage-content');
  const svg = document.getElementById('laser-svg');

  SKILLS_DATA.forEach(s => {
    // 1. Hotspot do Chakra
    const node = document.createElement('div');
    node.className = 'chakra-node';
    node.id = `node-${s.id}`;
    node.style.color = s.color;
    node.style.top = `${s.chakraY}%`;
    node.style.left = '50%';
    node.innerHTML = `
      <div class="chakra-pulse"></div>
      <div class="chakra-core"></div>
    `;
    node.onclick = () => toggleCard(s.id);
    content.appendChild(node);

    // 2. Linha Laser
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.id = `laser-${s.id}`;
    path.setAttribute('class', 'laser-beam');
    path.setAttribute('stroke', s.color);
    svg.appendChild(path);

    // 3. Card Lateral
    const card = document.createElement('div');
    card.className = 'skill-card';
    card.id = `card-${s.id}`;
    card.style.setProperty('--card-accent', s.color);
    card.style.setProperty('--card-glow', `${s.color}66`);
    card.style.top = `${s.cardY}%`;
    card.style.left = `${s.cardX}%`;

    let tagsHtml = s.tags.map(t => `<span class="skill-pill">${t}</span>`).join('');
    let specsHtml = s.details.map(d => `
      <div class="expanded-spec-item">
        <strong>${d.label}</strong>
        ${d.value}
      </div>
    `).join('');

    card.innerHTML = `
      <div class="skill-card-top">
        <span class="skill-card-category">${s.category}</span>
        <span class="skill-card-chakra">${s.chakra}</span>
      </div>
      <div class="skill-card-title">
        <span>${s.name}</span>
        <span class="expand-indicator">+</span>
      </div>
      <div class="skill-card-summary">${s.summary}</div>
      <div class="skill-tags-row">${tagsHtml}</div>
      
      <div class="skill-card-expand">
        <p class="expanded-desc">${s.description}</p>
        <div class="expanded-spec-list">${specsHtml}</div>
        <a href="https://github.com/${s.repo}" target="_blank" class="card-github-link">
          <span>Repositório no GitHub</span>
          <span>↗</span>
        </a>
      </div>
    `;
    card.onclick = (e) => {
      if (e.target.closest('a')) return;
      toggleCard(s.id);
    };
    content.appendChild(card);
  });

  setTimeout(updateLaserLines, 200);
}

function updateLaserLines() {
  const contentRect = document.getElementById('chakra-stage-content').getBoundingClientRect();

  SKILLS_DATA.forEach(s => {
    const nodeEl = document.getElementById(`node-${s.id}`);
    const cardEl = document.getElementById(`card-${s.id}`);
    const laserEl = document.getElementById(`laser-${s.id}`);

    if (!nodeEl || !cardEl || !laserEl) return;

    const nodeRect = nodeEl.getBoundingClientRect();
    const cardRect = cardEl.getBoundingClientRect();

    const x1 = nodeRect.left + nodeRect.width / 2 - contentRect.left;
    const y1 = nodeRect.top + nodeRect.height / 2 - contentRect.top;

    const x2 = s.side === 'right' ? (cardRect.left - contentRect.left) : (cardRect.right - contentRect.left);
    const y2 = cardRect.top + 28 - contentRect.top;

    const midX = (x1 + x2) / 2;
    const d = `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`;
    laserEl.setAttribute('d', d);
  });
}

function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  const node = document.getElementById(`node-${id}`);
  const laser = document.getElementById(`laser-${id}`);
  const isAlreadyActive = card.classList.contains('active');

  document.querySelectorAll('.skill-card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.chakra-node').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.laser-beam').forEach(l => l.classList.remove('active'));

  if (!isAlreadyActive) {
    card.classList.add('active');
    node.classList.add('active');
    laser.classList.add('active');
  }

  setTimeout(updateLaserLines, 120);
}

// ══════════════════════════════════════════════════════════════════════
// 3. ORQUESTRADOR DO SCROLL CONTÍNUO (Fase 1: 0..50% | Fase 2: 50..100%)
// ══════════════════════════════════════════════════════════════════════
function onWindowScroll() {
  const wrapper = document.getElementById('master-scroll-wrapper');
  const rect = wrapper.getBoundingClientRect();
  const maxScroll = wrapper.offsetHeight - window.innerHeight;
  const progress = Math.max(0, Math.min(1, -rect.top / maxScroll));

  document.getElementById('hud-progress').textContent = Math.round(progress * 100) + '%';

  const carouselCanvas = document.getElementById('webgl-carousel-canvas');
  const chakraLayer = document.getElementById('chakra-experience-layer');
  const flash = document.getElementById('dive-flash-overlay');

  if (progress < 0.50) {
    // ── FASE 1: O CARROSSEL 3D GIRA OS 8 CARDS ATÉ O FINAL ──
    document.getElementById('hud-phase').textContent = "01 · CARROSSEL DE PROJETOS 3D";
    document.getElementById('hud-phase').style.color = "var(--orange)";

    const p1 = progress / 0.50; // 0..1
    const totalSpan = TOTAL_CARDS * CARD_SPACING;
    updateCarouselCards(p1 * totalSpan);

    // Three.js visível e ativo
    carouselCanvas.style.opacity = 1;
    carouselCanvas.style.transform = `scale(1) translateZ(0)`;
    camera.position.z = 7.5;

    // Chakra escondido ao fundo
    chakraLayer.style.opacity = 0;
    chakraLayer.style.transform = `scale(0.6) translateY(100px)`;
    chakraLayer.classList.remove('interactive');
    flash.style.opacity = 0;

  } else {
    // ── FASE 2: O MERGULHO / DIVE-IN NA CENA CYBER-CHAKRA ──
    document.getElementById('hud-phase').textContent = "02 · MERGULHO CYBER-CHAKRA (THIAGO)";
    document.getElementById('hud-phase').style.color = "var(--primary)";

    const p2 = (progress - 0.50) / 0.50; // 0..1

    // 1. Câmera do Three.js acelera para frente atravessando o palco
    camera.position.z = 7.5 - (p2 * 12);
    carouselCanvas.style.opacity = Math.max(0, 1 - p2 * 2.2);

    // 2. Flash sutil de partículas de luz no momento da transição (em torno de p2 = 0.2)
    const flashVal = Math.sin(p2 * Math.PI) * 0.75;
    flash.style.opacity = flashVal;

    // 3. A camada do Chakra cresce suavemente de escala 0.65 -> 1.0 e opacidade 0 -> 1
    const chakraScale = 0.65 + (p2 * 0.35);
    const chakraY = (1 - p2) * 60;
    chakraLayer.style.opacity = Math.min(1, p2 * 1.8);
    chakraLayer.style.transform = `scale(${chakraScale}) translateY(${chakraY}px)`;

    if (p2 > 0.4) {
      chakraLayer.classList.add('interactive');
    } else {
      chakraLayer.classList.remove('interactive');
    }

    updateLaserLines();
  }
}

function scrollToChakra() {
  const wrapper = document.getElementById('master-scroll-wrapper');
  const targetY = wrapper.offsetTop + (wrapper.offsetHeight - window.innerHeight) * 0.75;
  window.scrollTo({ top: targetY, behavior: 'smooth' });
}

// Mouse Spotlight & Parallax
window.addEventListener('mousemove', (e) => {
  const spot = document.getElementById('mouse-spotlight');
  gsap.to(spot, { x: e.clientX, y: e.clientY, duration: 0.2, ease: "power2.out" });

  const avatar = document.getElementById('avatar-img');
  if (avatar) {
    const dx = (e.clientX - window.innerWidth / 2) * 0.01;
    const dy = (e.clientY - window.innerHeight / 2) * 0.01;
    gsap.to(avatar, { x: dx, y: dy, duration: 0.4, ease: "power2.out" });
  }
});

window.addEventListener('scroll', onWindowScroll, { passive: true });
window.addEventListener('DOMContentLoaded', () => {
  init3D();
  buildChakraElements();
  onWindowScroll();
});
</script>
