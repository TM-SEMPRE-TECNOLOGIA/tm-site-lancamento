<!DOCTYPE html>
<html lang="pt-BR" class="grabbable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jesper Landberg — 3D Cylindrical Motion Clone</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
  <style>
    :root {
      --orange: #d96526;
      --orange-glow: rgba(217, 101, 38, 0.65);
      --ink: #05070b;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--ink);
      color: #ffffff;
      font-family: var(--font-main);
      touch-action: none;
    }

    html.grabbable, html.grabbable * {
      cursor: grab;
    }

    html.grabbing, html.grabbing * {
      cursor: grabbing !important;
    }

    /* ── BACKGROUND CINEMATOGRÁFICO CONECTADO AO VÍDEO ── */
    #bg-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--ink) url('frames/frame_149.jpg') center/cover no-repeat;
      filter: saturate(0.85) contrast(1.1) brightness(0.65);
      pointer-events: none;
    }

    /* Overlay Editorial com Radial Glow Laranja */
    #bg-tone {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 65% 55% at 50% 50%, rgba(217, 101, 38, 0.18) 0%, transparent 70%),
        linear-gradient(90deg, rgba(5, 7, 11, 0.95) 0%, rgba(5, 7, 11, 0.55) 40%, rgba(5, 7, 11, 0.35) 65%, rgba(5, 7, 11, 0.85) 100%),
        linear-gradient(180deg, rgba(5, 7, 11, 0.75) 0%, transparent 35%, rgba(5, 7, 11, 0.92) 100%);
    }

    /* WebGL canvas container */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: auto;
    }

    /* Custom UI Overlays */
    .ui-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    /* Glass Panels for Config */
    .glass-panel {
      background: rgba(5, 7, 11, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(217, 101, 38, 0.25);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9), 0 0 30px rgba(217, 101, 38, 0.12);
    }

    /* Custom Floating Live Shader/Effects Config Panel */
    #config-panel {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    #config-panel.collapsed {
      transform: translateX(calc(100% + 20px));
      opacity: 0.25;
    }
    #config-panel.collapsed:hover {
      opacity: 1;
    }

    /* Scroll progress bar */
    .progress-bar {
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--orange);
      box-shadow: 0 0 12px var(--orange-glow);
      width: 0%;
      transition: width 0.05s linear;
    }

    /* Intro loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #05070b;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .loader-bar {
      width: 45px;
      height: 4px;
      background: rgba(217, 101, 38, 0.2);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar::after {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: var(--orange);
      box-shadow: 0 0 8px var(--orange-glow);
      animation: load-anim 1.2s ease-in-out infinite;
    }
    .loader-bar:nth-child(2)::after { animation-delay: 0.2s; }
    .loader-bar:nth-child(3)::after { animation-delay: 0.4s; }

    @keyframes load-anim {
      0% { left: -100%; }
      50% { left: 0%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body class="selection:bg-amber-500/20 selection:text-white">

  <!-- ═══════════════════════════════════════════════════════════ -->

    <div class="flex items-center justify-between border-b border-white/10 pb-3">

    <!-- Efeito de Shader dos Cards -->

      <input type="range" id="input-intensity" min="0" max="250" step="5" value="80" oninput="updateShaderIntensity(this.value)" class="w-full accent-[#d96526] bg-neutral-800 h-1.5 rounded-lg cursor-pointer" />

    <!-- Curvatura do Cilindro 3D -->

      </div>
      <input type="range" id="input-radius" min="6" max="35" step="0.5" value="10" oninput="updateCylinderRadius(this.value)" class="w-full accent-[#d96526] bg-neutral-800 h-1.5 rounded-lg cursor-pointer" />
    </div>

    <!-- Espaçamento dos Cards -->
    <div class="space-y-1.5">
      <div class="flex justify-between">
        <label class="font-semibold text-neutral-400">Espaçamento Horizontal</label>
        <span id="val-spacing" class="font-mono text-[10px] text-[#d96526]">5.2</span>
      </div>
      <input type="range" id="input-spacing" min="3.5" max="8.0" step="0.1" value="5.2" oninput="updateCardSpacing(this.value)" class="w-full accent-[#d96526] bg-neutral-800 h-1.5 rounded-lg cursor-pointer" />
    </div>

    <!-- Sensibilidade do Scroll / Drag -->
    <div class="space-y-1.5">
      <div class="flex justify-between">
        <label class="font-semibold text-neutral-400">Inércia & Física (Damping)</label>
        <span id="val-damping" class="font-mono text-[10px] text-[#d96526]">0.020</span>
      </div>
      <input type="range" id="input-damping" min="0.01" max="0.2" step="0.002" value="0.020" oninput="updateDamping(this.value)" class="w-full accent-[#d96526] bg-neutral-800 h-1.5 rounded-lg cursor-pointer" />
    </div>

    <!-- Grid de Fundo -->
    <div class="flex items-center justify-between pt-2 border-t border-white/10">
      <span class="text-neutral-400">Grid 3D no Chão (#d96526)</span>
      <input type="checkbox" id="toggle-grid" checked onchange="toggleGrid(this.checked)" class="accent-[#d96526] w-4 h-4 cursor-pointer" />
    </div>

    <!-- ── GERENCIADOR DE IMAGENS / CARDS ── -->
    <div class="pt-3 border-t border-white/10 space-y-2">
      <div class="flex items-center justify-between">
        <label class="font-bold text-[#d96526] flex items-center gap-1.5 uppercase tracking-wider text-[10px]">
          <i class="fa-solid fa-images"></i> Substituir Imagens (8 Cards)
        </label>
      </div>
      <div id="cards-editor-list" class="space-y-2 max-h-52 overflow-y-auto pr-1">
        <!-- Renderizado dinamicamente pelo JS -->
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!--  THREE.JS 3D SCENE & SHADER LOGIC                           -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <script>
    // ─── Project Dataset (8 Cards Descontraídos de Em Construção) ─
    const PROJECTS = [
      {
        id: "cat-dev",
        title: "Gato Dev // Em Construção",
        category: "Work In Progress",
        image: "assets/cards/card_1.jpg",
        aspect: 16 / 9,
      },
      {
        id: "robot-spark",
        title: "Robô Spark // Dev Trabalhando",
        category: "Hardware & Circuits",
        image: "assets/cards/card_2.jpg",
        aspect: 16 / 9,
      },
      {
        id: "duck-debug",
        title: "Rubber Duck // Debugging",
        category: "Coffee & Bugs",
        image: "assets/cards/card_3.jpg",
        aspect: 16 / 9,
      },
      {
        id: "astronaut-chill",
        title: "Astronauta // Projeto no Forno",
        category: "Lunar Station",
        image: "assets/cards/card_4.jpg",
        aspect: 16 / 9,
      },
      {
        id: "cyber-helmet",
        title: "Cyber Helmet // Obras Digitais",
        category: "System Build",
        image: "assets/cards/card_5.jpg",
        aspect: 16 / 9,
      },
      {
        id: "coffee-compile",
        title: "Café & Code // 99% Compilado",
        category: "Processing Assets",
        image: "assets/cards/card_6.jpg",
        aspect: 16 / 9,
      },
      {
        id: "drone-labs",
        title: "Drone Labs // TM Em Obras",
        category: "Automated Deploy",
        image: "assets/cards/card_7.jpg",
        aspect: 16 / 9,
      },
      {
        id: "cactus-cook",
        title: "Cacto Dev // Tá Cozinhando",
        category: "AI Datacenter",
        image: "assets/cards/card_8.jpg",
        aspect: 16 / 9,
      }
    ];

    // ─── Global State & Parameters ───────────────────────────
    let scene, camera, renderer;
    let cardMeshes = [];
    let gridHelper;
    let textureLoader;

    let targetScroll = 0;
    let currentScroll = 0;
    let scrollVelocity = 0;
    let isDragging = false;
    let startX = 0;
    let dragStartX = 0;

    // Config options (Exatamente como definido pelo usuário)
    let config = {
      cylinderRadius: 10.0,
      cardSpacing: 5.2,
      damping: 0.020,
      shaderType: 0, // 0: wave (Onda de Velocidade)
      intensity: 0.8, // 80%
      showGrid: true,
      cardBaseHeight: 2.8,
    };

    // ─── Custom Vertex & Fragment Shaders (Extremamente Visíveis) ───
    const vertexShader = `
      uniform float uTime;
      uniform float uVelocity;
      uniform float uRadius;
      uniform int uShaderType;
      uniform float uIntensity;
      uniform float uHover;
      uniform int uIsMobile;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying float vDistortion;

      void main() {
        vUv = uv;
        vNormal = normal;

        vec3 pos = position;

        // 1. Curvatura Cilíndrica profunda (Horizontal no Desktop / Vertical no Mobile)
        if (uIsMobile == 1) {
          float arc = pos.y / uRadius;
          pos.z -= (1.0 - cos(arc)) * uRadius;
          pos.y = sin(arc) * uRadius;
        } else {
          float arc = pos.x / uRadius;
          pos.z -= (1.0 - cos(arc)) * uRadius;
          pos.x = sin(arc) * uRadius;
        }

        float distVal = 0.0;

        // 2. Deformações por Shader Mode
        if (uShaderType == 0) {
          // 1. Liquid / Kinetic Wave (Onda fluida senoidal)
          float wave = sin((uIsMobile == 1 ? vUv.x : vUv.y) * 6.28 + uTime * 3.0 + (uIsMobile == 1 ? pos.y : pos.x)) * (abs(uVelocity) * 1.8 + 0.05 * uHover) * uIntensity;
          pos.z += wave;
          distVal = wave;
        } else if (uShaderType == 2) {
          // 3. Bulge 3D (Lente Esférica de Vidro)
          float dist = distance(vUv, vec2(0.5));
          float bulge = (1.0 - smoothstep(0.0, 0.6, dist)) * (0.35 + abs(uVelocity) * 1.5) * uIntensity;
          pos.z += bulge;
          distVal = bulge;
        }

        // Hover scale suave
        pos.z += uHover * 0.35;

        vDistortion = distVal;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `;

    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform float uVelocity;
      uniform float uTime;
      uniform int uShaderType;
      uniform float uIntensity;
      uniform float uHover;
      uniform float uAspect;

      varying vec2 vUv;
      varying vec3 vNormal;
      varying float vDistortion;

      // SDF para cantos arredondados perfeitos
      float roundedBox(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      void main() {
        vec2 uv = vUv;

        // 1. Cálculo de Cantos Arredondados com Anti-aliasing
        vec2 p = uv - vec2(0.5);
        p.x *= uAspect;
        vec2 halfSize = vec2(0.5 * uAspect, 0.5);
        float cornerRadius = 0.048; // Borda levemente arredondada elegante
        float dist = roundedBox(p, halfSize, cornerRadius);
        
        float alpha = 1.0 - smoothstep(0.0, 0.005, dist);
        if (alpha < 0.02) discard;

        vec4 color = vec4(1.0);

        if (uShaderType == 0) {
          // 1. Kinetic Wave + Liquid Distortion
          vec2 waveUv = uv;
          waveUv.x += sin(uv.y * 12.0 + uTime * 4.0) * (abs(uVelocity) * 0.08 + 0.015 * uHover) * uIntensity;
          waveUv.y += cos(uv.x * 12.0 + uTime * 4.0) * (abs(uVelocity) * 0.08 + 0.015 * uHover) * uIntensity;
          color = texture2D(uTexture, waveUv);
          color.rgb += vec3(0.85, 0.4, 0.15) * abs(sin(uv.y * 8.0 + uTime * 2.0)) * (abs(uVelocity) * 1.5 + uHover * 0.25) * uIntensity;

        } else if (uShaderType == 1) {
          // 2. RGB Shift / Aberração Cromática Dramática
          float shift = (abs(uVelocity) * 0.12 + 0.02 * uHover + 0.008) * uIntensity;
          float r = texture2D(uTexture, uv + vec2(shift, 0.0)).r;
          float g = texture2D(uTexture, uv).g;
          float b = texture2D(uTexture, uv - vec2(shift, 0.0)).b;
          color = vec4(r, g, b, 1.0);

        } else if (uShaderType == 2) {
          // 3. 3D Lens Bulge / Fish-Eye Óptico
          vec2 center = vec2(0.5);
          vec2 d = uv - center;
          float r = length(d);
          float zoom = 1.0 + (0.35 + abs(uVelocity) * 0.8) * uIntensity * (1.0 - r * 1.4);
          vec2 bulgeUv = center + d * clamp(zoom, 0.5, 2.0);
          color = texture2D(uTexture, bulgeUv);
          color.rgb *= mix(0.7, 1.1, 1.0 - r);

        } else if (uShaderType == 3) {
          // 4. Sci-Fi Hologram Matrix & Scanlines
          vec4 base = texture2D(uTexture, uv);
          float scanline = sin(uv.y * 300.0 + uTime * 10.0) * 0.15 * uIntensity;
          float noise = fract(sin(dot(uv, vec2(12.9898, 78.233)) + uTime) * 43758.5453) * 0.12 * uIntensity;
          vec3 holoColor = mix(base.rgb, vec3(0.85, 0.45, 0.15), 0.25 * uIntensity);
          color = vec4(holoColor - scanline + noise, 1.0);

        } else {
          // 5. Clean 3D Studio (Pure texture)
          color = texture2D(uTexture, uv);
        }

        // Borda e profundidade
        float vignette = smoothstep(0.85, 0.15, length(uv - vec2(0.5)));
        color.rgb *= mix(0.88, 1.05, vignette);

        // Borda luminosa alaranjada sutil (#d96526)
        float borderGlow = 1.0 - smoothstep(0.0, 0.009, abs(dist));
        color.rgb += vec3(0.85, 0.4, 0.15) * borderGlow * (0.35 + uHover * 0.5);

        // Hover highlight
        color.rgb += uHover * 0.08;

        gl_FragColor = vec4(color.rgb, alpha);
      }
    `;

    // ─── Helper: Responsive Mode Check ───────────────────────
    function isMobile() {
      return window.innerWidth < 768;
    }

    // ─── Initialize Three.js Scene ───────────────────────────
    function initThree() {
      const container = document.getElementById('webgl-canvas');

      // 1. Scene & Camera (Fundo transparente para mesclar com o backdrop)
      scene = new THREE.Scene();
      scene.background = null;
      scene.fog = new THREE.FogExp2(0x05070b, 0.028);

      const aspect = window.innerWidth / window.innerHeight;
      camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 100);
      updateCameraPosition();

      // 2. Renderer com canal alpha transparente
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // 3. Grid no chão no tom Laranja (#d96526)
      createGridFloor();

      // 4. Carregar Texturas e Criar Cards
      textureLoader = new THREE.TextureLoader();
      createCards();

      // 5. Event Listeners para Interatividade (Drag, Wheel, Resize)
      setupInteraction();

      // 6. Loop de Renderização
      animate();

      // Esconder loader após 1 segundo
      setTimeout(() => {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';
      }, 800);
    }

    function updateCameraPosition() {
      if (isMobile()) {
        camera.position.set(0, 0, 7.8);
        camera.lookAt(0, 0, 0);
      } else {
        camera.position.set(0, 0.2, 7.5);
        camera.lookAt(0, 0, 0);
      }
    }

    // ─── Create 3D Grid Floor (Laranja #d96526) ──────────────
    function createGridFloor() {
      const size = 60;
      const divisions = 60;
      // Cor primária #d96526, cor secundária marrom-alaranjado escuro
      gridHelper = new THREE.GridHelper(size, divisions, 0xd96526, 0x4a1e0b);
      gridHelper.material.opacity = 0.65;
      gridHelper.material.transparent = true;
      gridHelper.position.y = isMobile() ? -3.5 : -1.8;
      gridHelper.position.z = -5;
      scene.add(gridHelper);
    }

    // ─── Create 3D Cylindrical Cards ─────────────────────────
    function getCardDimensions(proj) {
      if (isMobile()) {
        const width = 3.6;
        const height = width / (proj.aspect || 1.6);
        return { width, height };
      } else {
        const height = config.cardBaseHeight;
        const width = height * (proj.aspect || 1.6);
        return { width, height };
      }
    }

    function createCards() {
      cardMeshes.forEach(m => scene.remove(m));
      cardMeshes = [];

      PROJECTS.forEach((proj, idx) => {
        const { width, height } = getCardDimensions(proj);
        const cardAspect = proj.aspect || (width / height);

        // Geometria subdividida para curvatura suave no shader
        const geometry = new THREE.PlaneGeometry(width, height, 32, 16);

        // Carregar textura
        const texture = textureLoader.load(proj.image, (tex) => {
          tex.generateMipmaps = true;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
        });

        // Shader Material Customizado com Transparência para Bordas Arredondadas
        const material = new THREE.ShaderMaterial({
          vertexShader: vertexShader,
          fragmentShader: fragmentShader,
          uniforms: {
            uTexture: { value: texture },
            uTime: { value: 0 },
            uVelocity: { value: 0 },
            uRadius: { value: isMobile() ? 14.0 : config.cylinderRadius },
            uShaderType: { value: config.shaderType },
            uIntensity: { value: config.intensity },
            uHover: { value: 0.0 },
            uIsMobile: { value: isMobile() ? 1 : 0 },
            uAspect: { value: cardAspect },
          },
          transparent: true,
          side: THREE.DoubleSide,
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.userData = {
          id: proj.id,
          title: proj.title,
          index: idx,
          baseWidth: width,
          baseHeight: height,
        };

        scene.add(mesh);
        cardMeshes.push(mesh);
      });
    }

    // ─── Update Card Positions on Cylindrical Curve ──────────
    function updateCardPositions() {
      const totalCards = cardMeshes.length;
      const mobile = isMobile();

      if (mobile) {
        // MODO MOBILE: DISPOSIÇÃO VERTICAL CILÍNDRICA
        const spacing = 3.2;
        const totalHeight = totalCards * spacing;
        const radius = 14.0;

        cardMeshes.forEach((mesh, i) => {
          let yOffset = -(i * spacing - currentScroll) % totalHeight;
          if (yOffset < -totalHeight / 2) yOffset += totalHeight;
          if (yOffset > totalHeight / 2) yOffset -= totalHeight;

          mesh.position.x = 0;
          mesh.position.y = yOffset;

          // Curvatura cilíndrica vertical (arco no eixo Y)
          const arc = yOffset / radius;
          mesh.position.z = -((1.0 - Math.cos(arc)) * radius);
          mesh.rotation.x = -arc; // Inclina para a câmera
          mesh.rotation.y = 0;

          if (mesh.material.uniforms) {
            mesh.material.uniforms.uVelocity.value = scrollVelocity;
            mesh.material.uniforms.uRadius.value = radius;
            mesh.material.uniforms.uShaderType.value = config.shaderType;
            mesh.material.uniforms.uIntensity.value = config.intensity;
            mesh.material.uniforms.uIsMobile.value = 1;
          }
        });

        const progressEl = document.getElementById('scroll-progress');
        if (progressEl) {
          const norm = Math.abs(currentScroll % totalHeight) / totalHeight;
          progressEl.style.width = (norm * 100).toFixed(1) + '%';
        }

      } else {
        // MODO DESKTOP: DISPOSIÇÃO HORIZONTAL CILÍNDRICA
        const totalWidth = totalCards * config.cardSpacing;

        cardMeshes.forEach((mesh, i) => {
          let xOffset = (i * config.cardSpacing - currentScroll) % totalWidth;
          if (xOffset < -totalWidth / 2) xOffset += totalWidth;
          if (xOffset > totalWidth / 2) xOffset -= totalWidth;

          mesh.position.x = xOffset;
          mesh.position.y = 0;

          // Curvatura cilíndrica horizontal (arco no eixo X)
          const arc = xOffset / config.cylinderRadius;
          mesh.position.z = -((1.0 - Math.cos(arc)) * config.cylinderRadius);
          mesh.rotation.x = 0;
          mesh.rotation.y = -arc;

          if (mesh.material.uniforms) {
            mesh.material.uniforms.uVelocity.value = scrollVelocity;
            mesh.material.uniforms.uRadius.value = config.cylinderRadius;
            mesh.material.uniforms.uShaderType.value = config.shaderType;
            mesh.material.uniforms.uIntensity.value = config.intensity;
            mesh.material.uniforms.uIsMobile.value = 0;
          }
        });

        const progressEl = document.getElementById('scroll-progress');
        if (progressEl) {
          const norm = Math.abs(currentScroll % totalWidth) / totalWidth;
          progressEl.style.width = (norm * 100).toFixed(1) + '%';
        }
      }
    }

    // ─── Animation Loop (60 FPS Physics & Render) ────────────
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Física com amortecimento (Inertia Damping)
      const diff = targetScroll - currentScroll;
      currentScroll += diff * config.damping;
      scrollVelocity = diff * config.damping;

      // Atualizar posições dos cards no cilindro
      updateCardPositions();

      // Atualizar tempo nos shaders
      cardMeshes.forEach(mesh => {
        if (mesh.material.uniforms) {
          mesh.material.uniforms.uTime.value = elapsedTime;
        }
      });

      // Renderizar cena
      renderer.render(scene, camera);
    }

    // ─── Interaction Handlers (Drag, Wheel, Touch) ───────────
    let startY = 0;
    let dragStartY = 0;

    function setupInteraction() {
      // 1. Wheel Scroll (Trackpad / Mouse Wheel)
      window.addEventListener('wheel', (e) => {
        if (isMobile()) {
          targetScroll += e.deltaY * 0.008;
        } else {
          const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          targetScroll += delta * 0.008;
        }
      }, { passive: true });

      // 2. Drag & Drop (Mouse)
      window.addEventListener('mousedown', (e) => {
        if (e.target.closest('#config-panel, .ui-layer button, .ui-layer a, input, select')) return;

        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        dragStartX = targetScroll;
        dragStartY = targetScroll;
        document.documentElement.classList.remove('grabbable');
        document.documentElement.classList.add('grabbing');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) {
          handleRaycastHover(e);
          return;
        }
        if (isMobile()) {
          const deltaY = e.clientY - startY;
          targetScroll = dragStartY + deltaY * 0.015;
        } else {
          const deltaX = e.clientX - startX;
          targetScroll = dragStartX - deltaX * 0.015;
        }
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        document.documentElement.classList.remove('grabbing');
        document.documentElement.classList.add('grabbable');
      });

      // 3. Touch Support (Mobile & Tablet)
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          dragStartX = targetScroll;
          dragStartY = targetScroll;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          if (isMobile()) {
            const deltaY = e.touches[0].clientY - startY;
            targetScroll = dragStartY + deltaY * 0.015;
          } else {
            const deltaX = e.touches[0].clientX - startX;
            targetScroll = dragStartX - deltaX * 0.015;
          }
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        isDragging = false;
      });

      // 4. Resize
      window.addEventListener('resize', onWindowResize);
    }

    // Raycast para Hover 3D nos Cards
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;

    function handleRaycastHover(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cardMeshes);

      if (intersects.length > 0) {
        const mesh = intersects[0].object;
        if (hoveredMesh !== mesh) {
          if (hoveredMesh) resetMeshHover(hoveredMesh);
          hoveredMesh = mesh;
          animateMeshHover(mesh, 1.0);
        }
      } else {
        if (hoveredMesh) {
          resetMeshHover(hoveredMesh);
          hoveredMesh = null;
        }
      }
    }

    function animateMeshHover(mesh, targetVal) {
      if (mesh.material && mesh.material.uniforms) {
        gsap.to(mesh.material.uniforms.uHover, {
          value: targetVal,
          duration: 0.4,
          ease: 'power2.out',
        });
      }
    }

    function resetMeshHover(mesh) {
      animateMeshHover(mesh, 0.0);
    }

    let lastIsMobile = isMobile();

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      updateCameraPosition();
      renderer.setSize(window.innerWidth, window.innerHeight);

      if (gridHelper) {
        gridHelper.position.y = isMobile() ? -3.5 : -1.8;
      }

      // Se alternou entre mobile e desktop, recria os cards com as novas dimensões
      if (isMobile() !== lastIsMobile) {
        lastIsMobile = isMobile();
        createCards();
      }
    }

    // ─── UI & Config Control Functions ───────────────────────
    function toggleConfigPanel() {
      const panel = document.getElementById('config-panel');
      panel.classList.toggle('collapsed');
    }

    function toggleOverlay(type) {
      const overlay = document.getElementById(`overlay-${type}`);
      const isOpen = overlay.classList.contains('opacity-100');

      if (isOpen) {
        overlay.classList.remove('opacity-100', 'pointer-events-auto');
        overlay.classList.add('opacity-0', 'pointer-events-none');
      } else {
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100', 'pointer-events-auto');
      }
    }

    function updateShaderEffect(val) {
      const map = { wave: 0, rgb: 1, bulge: 2, hologram: 3, clean: 4 };
      config.shaderType = map[val] !== undefined ? map[val] : 0;
    }

    function updateShaderIntensity(val) {
      config.intensity = parseFloat(val) / 100.0;
      document.getElementById('val-intensity').textContent = val + '%';
      cardMeshes.forEach(mesh => {
        if (mesh.material.uniforms) {
          mesh.material.uniforms.uIntensity.value = config.intensity;
        }
      });
    }

    function updateCylinderRadius(val) {
      config.cylinderRadius = parseFloat(val);
      document.getElementById('val-radius').textContent = parseFloat(val).toFixed(1);
    }

    function updateCardSpacing(val) {
      config.cardSpacing = parseFloat(val);
      document.getElementById('val-spacing').textContent = parseFloat(val).toFixed(1);
    }

    function updateDamping(val) {
      config.damping = parseFloat(val);
      document.getElementById('val-damping').textContent = parseFloat(val).toFixed(3);
    }

    function toggleGrid(show) {
      if (gridHelper) gridHelper.visible = show;
    }

    function resetPosition() {
      gsap.to(this, {
        duration: 1.2,
        ease: 'power3.out',
        onUpdate: () => { targetScroll = 0; }
      });
    }

    function setFilter(type) {
      const btnFeatured = document.getElementById('btn-featured');
      const btnAll = document.getElementById('btn-all');
      if (type === 'featured') {
        btnFeatured.className = 'interactive font-bold text-white transition';
        btnAll.className = 'interactive opacity-50 hover:opacity-100 text-white transition';
      } else {
        btnAll.className = 'interactive font-bold text-white transition';
        btnFeatured.className = 'interactive opacity-50 hover:opacity-100 text-white transition';
      }
    }

    function handleSubscribe(e) {
      e.preventDefault();
      alert('Obrigado pela inscrição! Você receberá atualizações em breve.');
      toggleOverlay('newsletter');
    }

    // ─── Live Cards & Image Replacer Editor ──────────────────
    function renderCardsEditor() {
      const list = document.getElementById('cards-editor-list');
      if (!list) return;
      list.innerHTML = '';

      PROJECTS.forEach((proj, idx) => {
        const item = document.createElement('div');
        item.className = 'p-2.5 bg-black/40 rounded-xl border border-white/10 space-y-1.5';
        item.innerHTML = `
          <div class="flex items-center justify-between text-[11px] font-semibold text-neutral-300">
            <span>Card #${idx + 1}: ${proj.title}</span>
          </div>
          <div class="space-y-1">
            <input type="text" value="${proj.image}" placeholder="URL da Imagem (https://...)" onchange="updateCardImage(${idx}, this.value)" class="w-full bg-neutral-900 border border-white/10 rounded px-2 py-1 text-[10px] text-neutral-300 focus:outline-none focus:border-amber-400 font-mono truncate" />
          </div>
        `;
        list.appendChild(item);
      });
    }

    function updateCardImage(idx, newUrl) {
      if (!newUrl || !cardMeshes[idx]) return;
      PROJECTS[idx].image = newUrl;
      textureLoader.load(newUrl, (tex) => {
        tex.generateMipmaps = true;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        cardMeshes[idx].material.uniforms.uTexture.value = tex;
        cardMeshes[idx].material.needsUpdate = true;
      });
    }

    // Inicialização na carga da página
    window.addEventListener('DOMContentLoaded', () => {
      initThree();
      renderCardsEditor();
    });
  </script>
</body>
</html>
