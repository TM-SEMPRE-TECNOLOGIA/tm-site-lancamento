<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Transições: Portfólio -> Galáxia de Stacks</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #d96526;
    --orange-glow: rgba(217, 101, 38, 0.4);
    --dark: #05070b;
    --card-bg: rgba(13, 17, 23, 0.85);
    --border: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  #webgl-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  .control-panel {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 12px;
    background: rgba(10, 14, 20, 0.88);
    backdrop-filter: blur(12px);
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .btn-mode {
    background: transparent;
    border: 1px solid transparent;
    color: #94a3b8;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: 'JetBrains Mono', monospace;
  }
  .btn-mode:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.2);
  }
  .btn-mode.active {
    background: var(--orange);
    color: #fff;
    box-shadow: 0 0 16px var(--orange-glow);
  }
  .hud-info {
    position: absolute;
    bottom: 32px;
    left: 32px;
    z-index: 10;
    max-width: 440px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-left: 3px solid var(--orange);
    padding: 20px 24px;
    border-radius: 6px;
    pointer-events: none;
    box-shadow: 0 12px 36px rgba(0,0,0,0.7);
  }
  .hud-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--orange);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .hud-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .hud-desc {
    font-size: 13px;
    line-height: 1.6;
    color: #94a3b8;
  }
  .scrub-bar {
    position: absolute;
    bottom: 32px;
    right: 32px;
    z-index: 10;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 280px;
  }
  .scrub-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    color: #cbd5e1;
  }
  input[type=range] {
    width: 100%;
    accent-color: var(--orange);
    cursor: pointer;
  }
  .trigger-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    color: #fff;
    padding: 8px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    cursor: pointer;
    border-radius: 4px;
    margin-top: 4px;
    transition: all 0.2s;
  }
  .trigger-btn:hover {
    background: var(--orange);
    border-color: var(--orange);
  }
</style>
</head>
<body>

<div class="control-panel">
  <button class="btn-mode active" onclick="setMode(1)">1: Zoom Galáctico (Contínuo)</button>
  <button class="btn-mode" onclick="setMode(2)">2: Expansão Card (Morph)</button>
  <button class="btn-mode" onclick="setMode(3)">3: Deslize Lateral (Dual-Stage)</button>
</div>

<div class="hud-info">
  <div class="hud-tag" id="mode-tag">OPÇÃO 1 · RECOMENDADA</div>
  <div class="hud-title" id="mode-title">Mergulho Contínuo (Camera Dive-In)</div>
  <div class="hud-desc" id="mode-desc">
    Ao atingir o final da rotação do carrossel, a câmera acelera para frente atravessando o último card. O palco cilíndrico se desfaz suavemente e a galáxia orbital de stacks emerge na mesma cena sem corte algum.
  </div>
</div>

<div class="scrub-bar">
  <div class="scrub-label">
    <span>Progresso da Transição</span>
    <span id="scrub-val" style="color:var(--orange)">0%</span>
  </div>
  <input type="range" id="progress-slider" min="0" max="100" value="0">
  <button class="trigger-btn" onclick="playAutoTransition()">▶ Simular Scroll Automático</button>
</div>

<canvas id="webgl-canvas"></canvas>

<script>
let currentMode = 1;
let scene, camera, renderer;
let carouselGroup, galaxyGroup, cardFinal;
let progress = 0;
let isAnimating = false;

function init() {
  const canvas = document.getElementById('webgl-canvas');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05070b, 0.035);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 8);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambient);
  const pointOrange = new THREE.PointLight(0xd96526, 3, 25);
  pointOrange.position.set(0, 2, 4);
  scene.add(pointOrange);

  buildCarouselMock();
  buildGalaxyMock();

  window.addEventListener('resize', onResize);
  document.getElementById('progress-slider').addEventListener('input', (e) => {
    progress = parseFloat(e.target.value) / 100;
    updateTransitionState(progress);
  });

  animate();
}

function buildCarouselMock() {
  carouselGroup = new THREE.Group();
  scene.add(carouselGroup);

  const cardGeo = new THREE.PlaneGeometry(2.4, 1.4);
  const total = 6;
  const radius = 6;

  for (let i = 0; i < total; i++) {
    const isLast = (i === total - 1);
    const mat = new THREE.MeshBasicMaterial({
      color: isLast ? 0xd96526 : 0x1e293b,
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(cardGeo, mat);
    const angle = (i / total) * Math.PI * 1.5 - 0.4;
    mesh.position.x = Math.sin(angle) * radius;
    mesh.position.z = Math.cos(angle) * radius - radius;
    mesh.rotation.y = angle;

    const edges = new THREE.EdgesGeometry(cardGeo);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: isLast ? 0xffffff : 0x475569 }));
    mesh.add(line);

    if (isLast) cardFinal = mesh;
    carouselGroup.add(mesh);
  }
}

function buildGalaxyMock() {
  galaxyGroup = new THREE.Group();
  galaxyGroup.position.set(0, 0, -20);
  galaxyGroup.visible = true;
  scene.add(galaxyGroup);

  const coreGeo = new THREE.SphereGeometry(0.8, 24, 24);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xd96526, wireframe: true });
  const core = new THREE.Mesh(coreGeo, coreMat);
  galaxyGroup.add(core);

  const rings = [2.2, 3.8, 5.4];
  const stacks = ["TypeScript", "Next.js", "Python", "FastAPI", "Three.js", "Docker", "Tailwind", "PostgreSQL"];
  
  rings.forEach((r) => {
    const ringGeo = new THREE.RingGeometry(r - 0.02, r + 0.02, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xd96526, side: THREE.DoubleSide, opacity: 0.25, transparent: true });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = Math.PI / 2.3;
    galaxyGroup.add(ringMesh);
  });

  stacks.forEach((st, idx) => {
    const ringRadius = rings[idx % rings.length];
    const angle = (idx / stacks.length) * Math.PI * 2;
    const nodeGeo = new THREE.BoxGeometry(0.45, 0.45, 0.45);
    const nodeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const node = new THREE.Mesh(nodeGeo, nodeMat);
    
    node.userData = { angle, ringRadius, speed: 0.008 + (idx * 0.002) };
    galaxyGroup.add(node);
  });
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.btn-mode').forEach((b, i) => b.classList.toggle('active', i + 1 === mode));
  
  const tag = document.getElementById('mode-tag');
  const title = document.getElementById('mode-title');
  const desc = document.getElementById('mode-desc');

  if (mode === 1) {
    tag.textContent = "OPÇÃO 1 · RECOMENDADA";
    title.textContent = "Mergulho Contínuo (Camera Dive-In)";
    desc.textContent = "Ao atingir o final da rotação do carrossel, a câmera acelera para frente atravessando o último card. O palco cilíndrico se desfaz suavemente e a galáxia orbital de stacks emerge na mesma cena sem corte algum.";
  } else if (mode === 2) {
    tag.textContent = "OPÇÃO 2";
    title.textContent = "Expansão de Card (Full-Bleed Morph)";
    desc.textContent = "O último card do carrossel ('Engenharia & Stack') trava no centro da tela e se expande em escala ocupando 100% da viewport como um portal. O conteúdo interno do card dá lugar à cena 3D das órbitas.";
  } else if (mode === 3) {
    tag.textContent = "OPÇÃO 3";
    title.textContent = "Deslize Lateral Puro (Dual-Stage)";
    desc.textContent = "O carrossel 3D desliza rigidamente para a esquerda da tela (-100vw), enquanto um segundo palco WebGL desliza da direita trazendo a constelação de stacks giratórias lado a lado.";
  }

  document.getElementById('progress-slider').value = 0;
  progress = 0;
  updateTransitionState(0);
}

function updateTransitionState(p) {
  document.getElementById('scrub-val').textContent = Math.round(p * 100) + '%';

  if (currentMode === 1) {
    camera.position.set(0, 0, 8 - p * 15);
    carouselGroup.position.x = 0;
    carouselGroup.position.z = 0;
    carouselGroup.rotation.y = -p * 1.5;
    
    carouselGroup.children.forEach(c => {
      if (c.material) {
        c.material.opacity = Math.max(0, 1 - p * 1.5);
        c.material.transparent = true;
      }
    });

    galaxyGroup.position.set(0, 0, -7 + p * 7);
    galaxyGroup.rotation.y = p * 2.0;

  } else if (currentMode === 2) {
    camera.position.set(0, 0, 8);
    carouselGroup.position.x = -p * 3;
    
    if (cardFinal) {
      const scale = 1 + p * 4.5;
      cardFinal.scale.set(scale, scale, 1);
      cardFinal.position.set(0, 0, p * 6);
      cardFinal.material.opacity = Math.max(0, 1 - p * 1.2);
      cardFinal.material.transparent = true;
    }

    galaxyGroup.position.set(0, 0, 0);
    galaxyGroup.scale.set(p, p, p);
    galaxyGroup.rotation.y = p * 1.5;

  } else if (currentMode === 3) {
    camera.position.set(0, 0, 8);
    carouselGroup.position.x = -p * 16;
    galaxyGroup.position.set(16 - p * 16, 0, 0);
    galaxyGroup.scale.set(1, 1, 1);
  }
}

function playAutoTransition() {
  if (isAnimating) return;
  isAnimating = true;
  const obj = { val: progress };
  gsap.to(obj, {
    val: progress > 0.8 ? 0 : 1,
    duration: 2.2,
    ease: "power2.inOut",
    onUpdate: () => {
      progress = obj.val;
      document.getElementById('progress-slider').value = progress * 100;
      updateTransitionState(progress);
    },
    onComplete: () => { isAnimating = false; }
  });
}

function animate() {
  requestAnimationFrame(animate);

  if (galaxyGroup) {
    galaxyGroup.children.forEach(child => {
      if (child.userData && child.userData.ringRadius) {
        child.userData.angle += child.userData.speed;
        const r = child.userData.ringRadius;
        child.position.x = Math.cos(child.userData.angle) * r;
        child.position.z = Math.sin(child.userData.angle) * r;
        child.position.y = Math.sin(child.userData.angle * 2) * 0.3;
        child.rotation.x += 0.02;
        child.rotation.y += 0.02;
      }
    });
  }

  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
